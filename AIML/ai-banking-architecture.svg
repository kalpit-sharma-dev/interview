<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="1560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.4 L 9 5 L 0 8.6 Z" fill="#3d4a57"/>
    </marker>
    <style>
      .b { fill:#ffffff; stroke:#3e6fb5; stroke-width:1.6; }
      .p { fill:#ffffff; stroke:#d4537e; stroke-width:1.6; }
      .t { fill:#1f2933; font-size:15px; font-weight:600; }
      .s { fill:#52606d; font-size:13px; }
      .g { fill:#1f2933; font-size:14px; font-weight:650; }
      .lbl { fill:#52606d; font-size:12px; }
    </style>
  </defs>

  <!-- Channels and identity -->
  <rect class="b" x="48" y="36" width="400" height="132" rx="8"/>
  <text class="t" x="248" y="68" text-anchor="middle">Customer channels</text>
  <text class="s" x="248" y="92" text-anchor="middle">Mobile banking app, net banking</text>
  <text class="s" x="248" y="112" text-anchor="middle">Other channels (future state)</text>
  <text class="s" x="248" y="132" text-anchor="middle">Public website</text>

  <rect class="p" x="512" y="36" width="400" height="132" rx="8"/>
  <text class="t" x="712" y="72" text-anchor="middle">Admin and identity</text>
  <text class="s" x="712" y="98" text-anchor="middle">Keycloak</text>
  <text class="s" x="712" y="120" text-anchor="middle">User roles, products, other config</text>

  <!-- Session and risk -->
  <rect class="p" x="48" y="216" width="400" height="118" rx="8"/>
  <text class="t" x="248" y="252" text-anchor="middle">Common SSO</text>
  <text class="s" x="248" y="278" text-anchor="middle">Logged-in session transfer</text>
  <text class="s" x="248" y="300" text-anchor="middle">Open session for the public site</text>

  <rect class="b" x="512" y="216" width="400" height="118" rx="8"/>
  <text class="t" x="712" y="262" text-anchor="middle">BioCatch</text>
  <text class="s" x="712" y="288" text-anchor="middle">Risk manager</text>

  <!-- Frontend -->
  <rect class="b" x="196" y="382" width="568" height="86" rx="8"/>
  <text class="t" x="480" y="416" text-anchor="middle">AI Banking Frontend</text>
  <text class="s" x="480" y="440" text-anchor="middle">API Gateway</text>

  <!-- Orchestration -->
  <rect class="b" x="48" y="516" width="864" height="292" rx="10"/>
  <text class="g" x="72" y="546">AI Banking orchestration layer</text>

  <rect class="p" x="72" y="568" width="250" height="88" rx="8"/>
  <text class="t" x="197" y="602" text-anchor="middle">Admin Integration</text>
  <text class="s" x="197" y="626" text-anchor="middle">DB / cache</text>

  <rect class="b" x="354" y="568" width="250" height="88" rx="8"/>
  <text class="t" x="479" y="602" text-anchor="middle">Session Manager</text>
  <text class="s" x="479" y="626" text-anchor="middle">DB / cache</text>

  <rect class="p" x="636" y="568" width="250" height="88" rx="8"/>
  <text class="t" x="761" y="594" text-anchor="middle">User Interaction</text>
  <text class="t" x="761" y="616" text-anchor="middle">Handler</text>
  <text class="s" x="761" y="638" text-anchor="middle">Controller</text>

  <rect class="b" x="72" y="684" width="250" height="88" rx="8"/>
  <text class="t" x="197" y="734" text-anchor="middle">Authenticator</text>

  <rect class="p" x="354" y="684" width="532" height="88" rx="8"/>
  <text class="t" x="620" y="718" text-anchor="middle">Common services</text>
  <text class="s" x="620" y="744" text-anchor="middle">MFA Orchestrator and session book-keeping</text>

  <!-- Agent -->
  <rect class="p" x="48" y="856" width="864" height="292" rx="10"/>
  <text class="g" x="72" y="886">Agent layer</text>

  <rect class="b" x="72" y="908" width="190" height="78" rx="8"/>
  <text class="t" x="167" y="952" text-anchor="middle">PII Tokenizer</text>

  <rect class="p" x="286" y="908" width="200" height="78" rx="8"/>
  <text class="t" x="386" y="940" text-anchor="middle">Intent Analyzer</text>
  <text class="s" x="386" y="962" text-anchor="middle">Planner</text>

  <rect class="b" x="510" y="908" width="160" height="78" rx="8"/>
  <text class="t" x="590" y="952" text-anchor="middle">Executor</text>

  <rect class="p" x="694" y="908" width="192" height="78" rx="8"/>
  <text class="t" x="790" y="940" text-anchor="middle">Agentic Gateway</text>
  <text class="s" x="790" y="962" text-anchor="middle">Rate limit, circuit break</text>

  <rect class="b" x="72" y="1016" width="250" height="72" rx="8"/>
  <text class="t" x="197" y="1058" text-anchor="middle">PII De-tokenizer</text>

  <rect class="p" x="354" y="1010" width="532" height="100" rx="8"/>
  <text class="t" x="620" y="1042" text-anchor="middle">Gen AI as a service</text>
  <text class="s" x="620" y="1066" text-anchor="middle">Gateway, prompt orchestration, model hub</text>
  <text class="s" x="620" y="1088" text-anchor="middle">LLM models, locked-down prompt</text>

  <!-- MCP -->
  <rect class="b" x="300" y="1196" width="360" height="78" rx="8"/>
  <text class="t" x="480" y="1226" text-anchor="middle">MCP Gateway</text>
  <text class="s" x="480" y="1250" text-anchor="middle">Channel-wise MCP servers</text>

  <rect class="p" x="48" y="1322" width="864" height="196" rx="10"/>
  <text class="g" x="72" y="1352">Internet banking MCP servers</text>
  <text class="s" x="480" y="1384" text-anchor="middle">Fund transfer, debit card, and the other channel tools</text>

  <rect class="b" x="72" y="1412" width="250" height="72" rx="8"/>
  <text class="t" x="197" y="1454" text-anchor="middle">Account service</text>

  <rect class="p" x="354" y="1412" width="250" height="72" rx="8"/>
  <text class="t" x="479" y="1454" text-anchor="middle">Fund transfer service</text>

  <rect class="b" x="636" y="1412" width="250" height="72" rx="8"/>
  <text class="t" x="761" y="1454" text-anchor="middle">Debit card service</text>

  <!-- Arrows -->
  <g fill="none" stroke="#3d4a57" stroke-width="1.3" marker-end="url(#arr)">
    <path d="M248 168 V216"/>
    <path d="M712 168 V216"/>
    <path d="M248 334 V360 H480 V382"/>
    <path d="M712 334 V360 H480"/>
    <path d="M480 468 V516"/>
    <path d="M712 168 H860 V568"/>
    <path d="M322 612 H354"/>
    <path d="M604 612 H636"/>
    <path d="M197 656 V684"/>
    <path d="M322 728 H354"/>
    <path d="M479 656 V684"/>
    <path d="M480 808 V856"/>
    <path d="M262 947 H286"/>
    <path d="M486 947 H510"/>
    <path d="M670 947 H694"/>
    <path d="M790 986 V1024 H322"/>
    <path d="M590 986 V1048 H354"/>
    <path d="M480 1156 V1196"/>
    <path d="M480 1274 V1322"/>
  </g>
  <text class="lbl" x="268" y="198">Signed-in session</text>
  <text class="lbl" x="500" y="500">Request</text>
  <text class="lbl" x="500" y="842">When a tool or a draft is needed</text>
  <text class="lbl" x="500" y="1182">Banking call, values restored</text>
</svg>
