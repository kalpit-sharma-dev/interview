    <path d="M320 832 H348 V684 H680"/>
    <path d="M190 680 V696"/>
    <path d="M190 740 V756"/>
    <path d="M190 796 V812"/>
    <path d="M1325 670 V760 H1080 V790"/>
    <path d="M1080 826 V890"/>
    <path d="M1080 930 V1000"/>
  </g>
</svg>
